[phases.setup]
nixPkgs = ["nodejs_20", "ffmpeg", "python3"]
cmds = ["echo 'Build timestamp: $(date)' > build_timestamp.txt"]

[phases.install]
cmds = [
  "npm ci",
  "export YOUTUBE_DL_SKIP_PYTHON_CHECK=1 && cd server && npm ci",
  "cd ../Student_summary && npm ci"
]

[phases.build]
cmds = ["cd Student_summary && npm run build"]

[start]
cmd = "node server/server.js"

[environment]
YOUTUBE_DL_SKIP_PYTHON_CHECK = "1"

